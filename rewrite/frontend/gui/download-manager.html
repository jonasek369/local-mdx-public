<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Download Manager</title>
	<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            {% if darktheme %}
            --md-bg: #1a1a1a;
            --md-surface: #242424;
            --md-surface-hover: #2a2a2a;
            --md-border: #3a3a3a;
            --md-text: #e8e8e8;
            --md-text-secondary: #a0a0a0;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-success: #4caf50;
            --md-danger: #f44336;
            --md-shadow: rgba(0, 0, 0, 0.5);
            {% else %}
            --md-bg: #f5f5f5;
            --md-surface: #ffffff;
            --md-surface-hover: #f9f9f9;
            --md-border: #e0e0e0;
            --md-text: #1a1a1a;
            --md-text-secondary: #666666;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-success: #4caf50;
            --md-danger: #f44336;
            --md-shadow: rgba(0, 0, 0, 0.1);
            {% endif %}
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: var(--md-bg);
            color: var(--md-text);
            min-height: 100vh;
            padding: 0;
        }

        .header {
            background: var(--md-surface);
            border-bottom: 1px solid var(--md-border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            color: var(--md-text);
            font-size: 20px;
            font-weight: 600;
            flex: 1;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--md-bg);
            border-radius: 4px;
            font-size: 13px;
            color: var(--md-text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--md-success);
        }

        .status-dot.paused {
            background: var(--md-text-secondary);
        }

		.status-dot.rate-limited {
			background: var(--md-accent);
		}

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            background: var(--md-accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 6px;
        }

        .button:hover {
            background: var(--md-accent-hover);
        }

        .button-secondary {
            background: var(--md-surface);
            color: var(--md-text);
            border: 1px solid var(--md-border);
        }

        .button-secondary:hover {
            background: var(--md-surface-hover);
        }

        .button-small {
            padding: 4px 10px;
            font-size: 13px;
        }

        .button-danger {
            background: transparent;
            color: var(--md-danger);
            border: 1px solid var(--md-danger);
        }

        .button-danger:hover {
            background: var(--md-danger);
            color: white;
        }

        .button-success {
            background: transparent;
            color: var(--md-success);
            border: 1px solid var(--md-success);
        }

        .button-success:hover {
            background: var(--md-success);
            color: white;
        }

        .section {
            margin-bottom: 32px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--md-text);
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .card {
            background: var(--md-surface);
            border: 1px solid var(--md-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .table-header {
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 12px 16px;
            background: var(--md-bg);
            border-bottom: 1px solid var(--md-border);
            font-size: 13px;
            font-weight: 600;
            color: var(--md-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 16px;
            border-bottom: 1px solid var(--md-border);
            transition: background 0.2s ease;
            align-items: center;
        }

        .row:hover {
            background: var(--md-surface-hover);
        }

        .row:last-child {
            border-bottom: none;
        }

        .cell {
            color: var(--md-text);
            font-size: 14px;
        }

        .cell-title {
            font-weight: 500;
        }

        .cell-actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--md-text-secondary);
            font-size: 14px;
        }

        input[type="radio"] {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: var(--md-accent);
        }

        label {
            color: var(--md-text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            flex: 1;
        }

        .progress-container {
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--md-bg);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-fill {
            height: 100%;
            background: var(--md-accent);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 12px;
            color: var(--md-text-secondary);
        }

        .download-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .download-title {
            font-weight: 500;
            color: var(--md-text);
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header {
                padding: 12px 16px;
            }

            .header h1 {
                font-size: 18px;
            }

            .table-header {
                display: none;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .cell-actions {
                width: 100%;
                justify-content: flex-start;
            }

        }
	</style>
</head>
<body>
<div class="header">
    <button class="button button-secondary" onClick="window.location.href='{{ back }}';">← Back</button>
    <h1>Download Manager</h1>
    <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span id="downloader-state">Ready</span>
    </div>
</div>

<div class="container">
    <!-- Queue Section -->
    <div class="section">
        <div class="section-header">
            <h2 class="section-title">Queue</h2>
            <div class="controls">
                <button onclick="start_download()" class="button">Start Download</button>
                <button onclick="stop_download()" class="button button-secondary">Stop Download</button>
            </div>
        </div>
        <div id="queue" class="card">
            <div class="table-header">
                <div>Title</div>
                <div>Actions</div>
            </div>
            <div class="empty-state">No items in queue</div>
        </div>
    </div>


    <!-- Currently Downloading Section -->
    <div class="section">
        <h2 class="section-title">Currently Downloading</h2>
        <div id="currently-working-on" class="card">
            <div class="empty-state">No active downloads</div>
        </div>
    </div>
</div>

<script>
    window.token = '{{ token }}';

    function start_download() {
        fetch("/manga/download/start")
    }

    function stop_download() {
        fetch("/manga/download/stop")
	}

    function update_state(data){
		const queue = document.getElementById("queue");

		// TODO: Dont remove all the cells
        while (queue.firstChild) {
            queue.removeChild(queue.firstChild);
        }

        // Add header
        const headerDiv = document.createElement("div");
        headerDiv.className = "table-header";
        headerDiv.innerHTML = `
            <div>Title</div>
            <div>Actions</div>
        `;
        queue.appendChild(headerDiv);

        if (Object.keys(data.queue).length === 0) {
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "empty-state";
            emptyDiv.textContent = "No items in queue";
            queue.appendChild(emptyDiv);
        } else {
            Object.keys(data.queue).forEach((key, index) => {
                const EntryDiv = document.createElement("div");
                EntryDiv.className = "row";

                const EntryText = document.createElement("div");
                EntryText.className = "cell cell-title";
                EntryText.innerHTML = data.queue[key]

                const ActionsCell = document.createElement("div");
                ActionsCell.className = "cell cell-actions";

                const PushToTopButton = document.createElement("button");
                PushToTopButton.className = "button button-small button-success";
                PushToTopButton.innerHTML = "↑ Push to top";
                PushToTopButton.addEventListener("click", function () {
                    fetch("/manga/download/push-to-top", {method: "POST", body: JSON.stringify({"identifier": key})});
                });

                const RemoveButton = document.createElement("button");
                RemoveButton.className = "button button-small button-danger";
                RemoveButton.innerHTML = "Remove";
                RemoveButton.addEventListener("click", function () {
                    fetch("/manga/download/pop-job", {method: "POST", body: JSON.stringify({"identifier": key})});
                });

                ActionsCell.appendChild(PushToTopButton);
                ActionsCell.appendChild(RemoveButton);

                EntryDiv.appendChild(EntryText);
                EntryDiv.appendChild(ActionsCell);
                queue.append(EntryDiv);
            });
        }

        const divUpdates = document.getElementById("currently-working-on");
		while (divUpdates.firstChild) {
            divUpdates.removeChild(divUpdates.firstChild);
		}


		const divRow = document.createElement("div");
        divRow.className = "row";

        const stateText = document.getElementById("downloader-state");
        const statusDot = document.getElementById("status-dot");

		statusDot.classList.remove('paused', 'rate-limited');


		if (data.state === "DOWNLOADING") {
		    stateText.innerHTML = "Downloading";
		} else if (data.state === "Awaiting") {
		    stateText.innerHTML = "Waiting";
		    statusDot.classList.add('paused');
		} else if (data.state === "RATELIMITED") {
		    stateText.innerHTML = "Ratelimited";
		    statusDot.classList.add('rate-limited');
		} else {
		    stateText.innerHTML = "Ready";
		}

        if(data.currently_working_on == null){
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "empty-state";
            emptyDiv.textContent = "No active downloads";
            divUpdates.appendChild(emptyDiv);
            return;
		}
		const a = document.createElement("div");
        a.className = "cell download-info"
		a.id = "cwo"
        let chapter_perc = Math.round((100 * data.currently_working_on.chapter_status[0]) / data.currently_working_on.chapter_status[1]);
        a.innerHTML = `
            <div class="download-title">${data.currently_working_on.title}</div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${chapter_perc}%"></div>
                </div>
                <div class="progress-text">${chapter_perc}% complete</div>
            </div>
        `;
        divRow.appendChild(a);
        divUpdates.append(divRow);
	}



	const source = new EventSource("/manga/download/stream");

    source.onmessage = (event) => {
	    const data = JSON.parse(event.data);
	    update_state(data);
	}

</script>
</body>
</html>
