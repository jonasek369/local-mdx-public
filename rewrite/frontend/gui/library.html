<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <style>

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            background-color: hsl(12.25 100% 62.55%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 20px;
        }

        .button:hover {
            background-color: hsl(12.5 77.06% 57.25%);
        }

        .button:active {
            background-color: hsl(12.09 52.23% 48.43%);
        }


        #content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }


        .manga {
            width: 90%;
            max-width: 600px;
            height: 150px;
            display: flex;
            align-items: center;
            margin: 15px 0;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .manga:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .manga img {
            width: 80px;
            height: 120px;
            margin: 0 20px;
            object-fit: cover;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .manga .details {
            flex: 1;
            padding: 10px;
        }

        .manga .name {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
            color: #333;
        }

        .manga .description {
            font-size: 14px;
            color: #666;
            margin: 10px 0 0;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }


        @media (max-width: 600px) {
            .manga {
                height: auto;
                flex-direction: column;
                align-items: flex-start;
                padding: 15px;
            }

            .manga img {
                margin: 0 0 15px 0;
            }

            .manga .name {
                font-size: 20px;
            }

            .manga .description {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <button class="button" onClick="window.location.href='/';">Back</button>
    <div id="content">
    </div>
<script>
    window.token = '{{ token }}';
    var ran = false;

    function getMethods(obj) {
        var result = [];
        for (var id in obj) {
            try {
                if (typeof (obj[id]) == "function") {
                    result.push(id + ": " + obj[id].toString());
                }
            } catch (err) {
                result.push(id + ": inaccessible");
            }
        }
        return result;
    }

    // From https://gist.github.com/dharmavir/936328
    function getHttpRequestObject() {
        // Define and initialize as false
        var xmlHttpRequst = false;

        // Mozilla/Safari/Non-IE
        if (window.XMLHttpRequest) {
            xmlHttpRequst = new XMLHttpRequest();
        }
        // IE
        else if (window.ActiveXObject) {
            xmlHttpRequst = new ActiveXObject("Microsoft.XMLHTTP");
        }
        return xmlHttpRequst;
    }

    // Does the AJAX call to URL specific with rest of the parameters
    function doAjax(url, method, responseHandler, data) {
        // Set the variables
        url = url || "";
        method = method || "GET";
        async = true;
        data = data || {};
        data.token = window.token;

        if (url == "") {
            alert("URL can not be null/blank");
            return false;
        }
        var xmlHttpRequest = getHttpRequestObject();

        // If AJAX supported
        if (xmlHttpRequest != false) {
            xmlHttpRequest.open(method, url, async);
            // Set request header (optional if GET method is used)
            if (method == "POST") {
                xmlHttpRequest.setRequestHeader("Content-Type", "application/json");
            }
            // Assign (or define) response-handler/callback when ReadyState is changed.
            xmlHttpRequest.onreadystatechange = responseHandler;
            // Send data
            xmlHttpRequest.send(JSON.stringify(data));
        } else {
            alert("Please use browser with Ajax support.!");
        }
    }

    function set_library(response) {
        console.log("setting library")
        if (!this.responseText)
            return;
        const data = JSON.parse(this.responseText).response;

        const elem = document.getElementById("content");
        if (elem.children.length > 0) {
            return;
        }

        for (const [key, value] of Object.entries(data)) {
            const to_append = document.createElement("div");
            to_append.className = "manga";
            const info = document.createElement("div");

            const cover = document.createElement("img");
            cover.setAttribute("alt", value[0] + " cover art");
            cover.src = "/manga/cover/" + key + "?small=1";
            const name = document.createElement("a");
            name.innerText = value[0];
            name.className = "name"
            console.log(value);
            const desc = document.createElement("a");
            if (value[1] !== null && value[1].indexOf("\n") != -1) {
                desc.innerText = value[1].substring(0, value[1].indexOf("\n"));
            } else {
                desc.innerText = value[1];
            }
            if (desc.innerText && desc.innerText.length > 64) {
                desc.innerText = desc.innerText.substring(0, 64) + "...";
            } else {
                desc.innerText = desc.innerText;
            }

            desc.className = "description"
            to_append.appendChild(cover);

            info.appendChild(name);
            info.appendChild(document.createElement("br"));
            info.appendChild(desc);

            to_append.append(info);

            to_append.style.cursor = 'pointer';
            to_append.onclick = function () {
                window.location.href = "/manga/" + key + "?from=/manga/library";
            }

            elem.appendChild(to_append);
        }

    }

    doAjax("/manga/library/data", "GET", set_library, null);
</script>
</body>
</html>
