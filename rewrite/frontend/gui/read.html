<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page }} | Chapter {{ chapter_no }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            {% if darktheme %}
            --md-bg: #0d0d0d;
            --md-surface: #1a1a1a;
            --md-surface-hover: #242424;
            --md-border: #2a2a2a;
            --md-text: #ffffff;
            --md-text-secondary: #b0b0b0;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-shadow: rgba(0, 0, 0, 0.7);
            {% else %}
            --md-bg: #0d0d0d;
            --md-surface: #1a1a1a;
            --md-surface-hover: #242424;
            --md-border: #2a2a2a;
            --md-text: #ffffff;
            --md-text-secondary: #b0b0b0;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-shadow: rgba(0, 0, 0, 0.7);
            {% endif %}
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--md-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
        }

        /* Top navigation bar */
        .reader-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: var(--md-surface);
            border-bottom: 1px solid var(--md-border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .reader-header.hidden {
            transform: translateY(-100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            background-color: transparent;
            color: var(--md-text);
            border: 1px solid var(--md-border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .button:hover {
            background-color: var(--md-surface-hover);
        }

        .button-accent {
            background-color: var(--md-accent);
            color: white;
            border-color: var(--md-accent);
        }

        .button-accent:hover {
            background-color: var(--md-accent-hover);
        }

        .page-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--md-text);
            font-weight: 500;
        }

        .page-counter {
            background-color: var(--md-surface);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--md-accent);
            color: var(--md-text);
            font-weight: 600;
        }

        /* Navigation arrows */
        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--md-surface);
            border: 1px solid var(--md-border);
            color: var(--md-text);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 100;
            font-size: 20px;
            opacity: 0.7;
        }

        .nav-arrow:hover {
            opacity: 1;
            background-color: var(--md-accent);
            border-color: var(--md-accent);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-arrow.left {
            left: 20px;
        }

        .nav-arrow.right {
            right: 20px;
        }

        .nav-arrow.hidden {
            display: none;
        }

        /* Image container */
        .page-content {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: calc(100vh - 60px);
            padding: 20px;
        }

        .page-content img {
            max-width: 100%;
            max-height: calc(100vh - 100px);
            width: auto;
            height: auto;
            display: block;
            border-radius: 4px;
            box-shadow: 0 4px 12px var(--md-shadow);
            cursor: pointer;
            user-select: none;
            object-fit: contain;
        }

        .page-content img.hidden {
            display: none;
        }

        /* Loading state */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--md-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: var(--md-text);
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--md-border);
            border-top-color: var(--md-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: var(--md-text-secondary);
        }

        /* Progress bar */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background-color: var(--md-surface);
            z-index: 999;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--md-accent);
            transition: width 0.3s ease;
        }

        /* Chapter navigation */
        .chapter-nav {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }

        /* Keyboard shortcuts hint */
        .shortcuts-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--md-surface);
            border: 1px solid var(--md-border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--md-text-secondary);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        .shortcuts-hint.show {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .reader-header {
                padding: 10px 16px;
            }

            .page-info {
                font-size: 13px;
            }

            .nav-arrow {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .nav-arrow.left {
                left: 10px;
            }

            .nav-arrow.right {
                right: 10px;
            }

            .page-content {
                margin-top: 50px;
                padding: 10px;
            }

            .shortcuts-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading pages...</div>
    </div>

    <!-- Top navigation -->
    <div class="reader-header" id="header">
        <div class="header-left">
            <button class="button" onClick="window.location.href='/manga/{{muuid}}';">← Back</button>
            <div class="page-counter" id="page-header">1/{{ pages }}</div>
        </div>
        <div class="chapter-nav">
            <button class="button" id="prev-chapter" style="display: none;">← Previous Chapter</button>
            <button class="button button-accent" id="next-chapter" style="display: none;">Next Chapter →</button>
        </div>
    </div>

    <!-- Navigation arrows -->
    <button class="nav-arrow left" id="nav-left" onclick="page_back()">‹</button>
    <button class="nav-arrow right" id="nav-right" onclick="page_next()">›</button>

    <!-- Progress bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>

    <!-- Image container -->
    <div id="content" class="page-content"></div>

    <!-- Keyboard shortcuts hint -->
    <div class="shortcuts-hint" id="shortcuts">
        Use ← → arrow keys or click sides to navigate
    </div>

    <script>
        window.token = '{{ token }}';

        const content = document.getElementById('content');
        const page_header = document.getElementById("page-header");
        const loading = document.getElementById("loading");
        const header = document.getElementById("header");
        const progress = document.getElementById("progress");
        const shortcutsHint = document.getElementById("shortcuts");
        const navLeft = document.getElementById("nav-left");
        const navRight = document.getElementById("nav-right");

        let nextChapter = null;
        let prevChapter = null;
        let relocated = false;
        let pageCount = {{pages}};
        let page = {{page}};
        let headerVisible = true;
        let hideHeaderTimeout = null;

        // Show shortcuts hint on load
        setTimeout(() => {
            shortcutsHint.classList.add('show');
            setTimeout(() => {
                shortcutsHint.classList.remove('show');
            }, 3000);
        }, 1000);

        // Auto-hide header
        function resetHeaderTimeout() {
            headerVisible = true;
            header.classList.remove('hidden');
            clearTimeout(hideHeaderTimeout);
            hideHeaderTimeout = setTimeout(() => {
                headerVisible = false;
                header.classList.add('hidden');
            }, 3000);
        }

        document.addEventListener('mousemove', resetHeaderTimeout);
        resetHeaderTimeout();

        function updateProgress() {
            const percentage = (page / pageCount) * 100;
            progress.style.width = percentage + '%';
        }

        function updateNavButtons() {
            if (page === 1) {
                navLeft.classList.add('hidden');
            } else {
                navLeft.classList.remove('hidden');
            }

            if (page === pageCount && !nextChapter) {
                navRight.classList.add('hidden');
            } else {
                navRight.classList.remove('hidden');
            }
        }

        // Fetches all the pages at once
        function full_load() {
            fetch("/page-images/{{cuuid}}")
                .then(response => response.json())
                .then(data => {
                    for (const key in data) {
                        const img = document.createElement("img");
                        img.id = "page-panel";
                        img.src = `data:image/webp;base64,${data[key]}`;
                        img.classList.add("hidden");
                        img.addEventListener("mousedown", handle_click);
                        content.appendChild(img);
                    }
                    page_header.innerHTML = `${page}/${pageCount}`;
                    set_page(page);
                    loading.style.display = 'none';
                    updateProgress();
                    updateNavButtons();
                });
        }

        function set_page(to_page) {
            if (content.children.length === 0) {
                return;
            }
            let current_page = content.children.item(page - 1);
            let _set_page = content.children.item(to_page - 1);

            current_page.classList.add("hidden");
            _set_page.classList.remove("hidden");
            page_header.innerHTML = to_page + "/" + pageCount;
            document.title = `${to_page} | Chapter {{ chapter_no }}`

            // Scroll to top when changing pages
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateProgress();
            updateNavButtons();
        }

        function handle_click(event) {
            const image = event.target;
            const boundingRect = image.getBoundingClientRect();
            const clickX = event.clientX - boundingRect.left;
            const imageWidth = boundingRect.width;
            const midpoint = imageWidth / 2;

            if (clickX < midpoint) {
                page_back();
            } else {
                page_next();
            }
        }

        function page_next() {
            if (relocated) {
                return;
            }
            var pageCopy = page;
            if (page + 1 > pageCount && nextChapter !== null) {
                window.location.href = "/read/" + nextChapter + "/1";
                relocated = true;
                return;
            }
            if (page === pageCount && nextChapter === null){
                window.location.href = "/manga/{{muuid}}";
                return;
            }
            var new_page = Math.max(1, Math.min(page + 1, pageCount));
            if (new_page === pageCopy) {
                return;
            }
            set_page(new_page);
            page = new_page;
        }

        function page_back() {
            if (relocated) {
                return;
            }
            var pageCopy = page;
            if (page - 1 < 1 && prevChapter !== null) {
                window.location.href = "/read/" + prevChapter + "?end=true";
                relocated = true;
                return;
            }
            var new_page = Math.max(1, Math.min(page - 1, pageCount));
            if (new_page === pageCopy) {
                return;
            }
            set_page(new_page);
            page = new_page;
        }

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case "ArrowRight":
                    page_next();
                    break;
                case "ArrowLeft":
                    page_back();
                    break;
                default:
                    break;
            }
        });

        full_load();
        fetch("/read/next-prev/{{cuuid}}")
            .then(response => response.json())
            .then(data => {
                nextChapter = data["next"];
                prevChapter = data["prev"];

                const prevBtn = document.getElementById('prev-chapter');
                const nextBtn = document.getElementById('next-chapter');

                if (prevChapter) {
                    prevBtn.style.display = 'inline-flex';
                    prevBtn.onclick = () => {
                        window.location.href = "/read/" + prevChapter + "?end=true";
                    };
                }

                if (nextChapter) {
                    nextBtn.style.display = 'inline-flex';
                    nextBtn.onclick = () => {
                        window.location.href = "/read/" + nextChapter + "/1";
                    };
                }

                updateNavButtons();
            });
    </script>
</body>
</html>
