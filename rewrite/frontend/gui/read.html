<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: auto;
        }

        /* Page header box */
        #page-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            width: 200px;
            height: 50px;
            text-align: center;
            color: #333333;
            background-color: #f2f2f2;
            border: 2px solid #999999;
            font-size: 30px;
            font-weight: bold;
            font-family: sans-serif;
        }

        /* Back button */
        .button {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            background-color: hsl(12.25 100% 62.55%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .button:hover {
            background-color: hsl(12.5 77.06% 57.25%);
        }

        .button:active {
            background-color: hsl(12.09 52.23% 48.43%);
        }

        /* Image container */
        .page-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh; /* Full viewport height */
        }

        .page-content img {
            object-fit: contain;
            height: 100vh;
            width: auto;
            max-width: 100%;
        }

        .hidden {
            visibility: hidden;
            display: none;
            pointer-events: none;
        }
    </style>

</head>
<body>
<button class="button" onClick="window.location.href='/manga/{{muuid}}';">Back</button>

<!-- Page header box -->
<h1 id="page-header">1/{{ pages }} pages</h1>

<!-- Image container -->
<div id="content" class="page-content"></div>

<script>
    window.token = '{{ token }}';

    const content = document.getElementById('content');
    const page_header = document.getElementById("page-header");

    let nextChapter = null;
    let prevChapter = null;

    let relocated = false;

    let pageCount = {{pages}};
    let page = {{page}};

    // Fetches all the pages at once
    function full_load() {
        fetch("/page-images/{{cuuid}}")
            .then(response => response.json())
            .then(data => {
                for (const key in data) {
                    const img = document.createElement("img");
                    img.id = "page-panel";
                    img.src = `data:image/png;base64,${data[key]}`;
                    img.classList.add("hidden");
                    content.appendChild(img);
                }
                page_header.innerHTML = `${page}/${pageCount} pages`;
                set_page(page);
            });
    }

    function set_page(to_page) {
        if (content.children.length === 0) {
            return;
        }
        let current_page = content.children.item(page - 1);
        let _set_page = content.children.item(to_page - 1);

        current_page.classList.add("hidden");
        current_page.removeEventListener("mousedown", handle_click);
        _set_page.classList.remove("hidden");
        _set_page.addEventListener("mousedown", handle_click);
        page_header.innerHTML = to_page + "/" + pageCount + " pages";
    }

    function handle_click(event) {
        const image = document.querySelector('#page-panel:not(.hidden)');
        const boundingRect = image.getBoundingClientRect();
        const clickX = event.clientX - boundingRect.left;
        const imageWidth = boundingRect.width;

        // Calculate the midpoint of the image
        const midpoint = imageWidth / 2;

        console.log(clickX, midpoint);

        if (clickX < midpoint) {
            page_sub();
        } else {
            page_add();
        }
    }

    function page_add() {
        if (relocated) {
            return;
        }
        var pageCopy = page;
        if (page + 1 > pageCount && nextChapter !== null) {
            window.location.href = "/read/" + nextChapter + "/1";
            relocated = true;
        }
        var new_page = Math.max(1, Math.min(page + 1, pageCount));
        if (new_page === pageCopy) {
            return;
        }
        set_page(new_page);
        page = new_page;
    }

    function page_sub() {
        if (relocated) {
            return;
        }
        var pageCopy = page;
        if (page - 1 < 1 && prevChapter !== null) {
            window.location.href = "/read/" + prevChapter + "?end=true";
            relocated = true;
        }
        var new_page = Math.max(1, Math.min(page - 1, pageCount));
        if (new_page === pageCopy) {
            return;
        }
        set_page(new_page);
        page = new_page;
    }

    document.addEventListener('keydown', (event) => {
        switch (event.key) {
            case "ArrowRight":
                page_add();
                break;
            case "ArrowLeft":
                page_sub();
                break;
            default:
                break;
        }
    });

    full_load();
    fetch("/read/next-prev/{{cuuid}}")
        .then(response => response.json())
        .then(data => {
            nextChapter = data["next"];
            prevChapter = data["prev"];
        });
</script>
</body>
</html>
