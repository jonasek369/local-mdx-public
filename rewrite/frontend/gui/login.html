<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LMDX - Login</title>
	<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            {% if darktheme %}
            --md-bg: #1a1a1a;
            --md-surface: #242424;
            --md-surface-hover: #2a2a2a;
            --md-border: #3a3a3a;
            --md-text: #e8e8e8;
            --md-text-secondary: #a0a0a0;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-shadow: rgba(0, 0, 0, 0.3);
            {% else %}
            --md-bg: #f5f5f5;
            --md-surface: #ffffff;
            --md-surface-hover: #f9f9f9;
            --md-border: #e0e0e0;
            --md-text: #1a1a1a;
            --md-text-secondary: #666666;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-shadow: rgba(0, 0, 0, 0.1);
            {% endif %}
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background-color: var(--md-bg);
            color: var(--md-text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .back-button {
            position: absolute;
            top: 24px;
            left: 24px;
            background: none;
            color: var(--md-text);
            border: 1px solid var(--md-border);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-button:hover {
            background-color: var(--md-surface-hover);
            border-color: var(--md-accent);
            color: var(--md-accent);
        }

        .container {
            background-color: var(--md-surface);
            border: 1px solid var(--md-border);
            border-radius: 10px;
            padding: 40px 32px;
            box-shadow: 0 8px 24px var(--md-shadow);
            width: 360px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--md-text);
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--md-text-secondary);
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--md-border);
            border-radius: 6px;
            background-color: var(--md-surface-hover);
            color: var(--md-text);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input[type="password"]:focus {
            border-color: var(--md-accent);
            outline: none;
            background-color: var(--md-surface);
        }

        input[type="submit"] {
            margin-top: 24px;
            width: 100%;
            padding: 12px 16px;
            background-color: var(--md-accent);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        input[type="submit"]:hover {
            background-color: var(--md-accent-hover);
        }

        .footer-note {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--md-text-secondary);
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 28px 20px;
            }

            h2 {
                font-size: 20px;
            }
        }
	</style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form onsubmit="handle_login(); return false;">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autofocus>

            <input type="submit" value="Login">
        </form>
	</div>

<script>
    function handle_login() {
        const password = document.getElementById("password").value;

        fetch('/login/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'ok') {
                window.location.href = '/';
            } else {
                alert('Login failed. Please check your password.');
            }
        })
        .catch(() => alert('An error occurred during login.'));
    }
</script>
</body>
</html>
