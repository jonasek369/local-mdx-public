<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ name }}</title>
	<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
        {% if darktheme %}
            --md-bg: #1a1a1a;
            --md-surface: #242424;
            --md-surface-hover: #2a2a2a;
            --md-border: #3a3a3a;
            --md-text: #e8e8e8;
            --md-text-secondary: #a0a0a0;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-success: #4caf50;
            --md-danger: #f44336;
            --md-shadow: rgba(0, 0, 0, 0.5);
        {% else %}
            --md-bg: #f5f5f5;
            --md-surface: #ffffff;
            --md-surface-hover: #f9f9f9;
            --md-border: #e0e0e0;
            --md-text: #1a1a1a;
            --md-text-secondary: #666666;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-success: #4caf50;
            --md-danger: #f44336;
            --md-shadow: rgba(0, 0, 0, 0.15);
        {% endif %}
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background-color: var(--md-bg);
            color: var(--md-text);
        }

        .header {
            position: relative;
            min-height: 400px;
            overflow: hidden;
            display: flex;
            align-items: center;
            background: var(--md-surface);
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("/api/manga/cover/{{ muuid }}");
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.3);
            transform: scale(1.1);
            z-index: 0;
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
            display: flex;
            gap: 32px;
            align-items: flex-start;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            background-color: var(--md-surface);
            color: var(--md-text);
            border: 1px solid var(--md-border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 2;
        }

        .back-button:hover {
            background-color: var(--md-surface-hover);
        }

        .cover-image {
            flex-shrink: 0;
            width: 240px;
            height: 360px;
            background-image: url("/api/manga/cover/{{ muuid }}");
            background-size: cover;
            background-position: center;
            border-radius: 6px;
            box-shadow: 0 8px 24px var(--md-shadow);
            transition: transform 0.3s ease;
        }

        .cover-image:hover {
            transform: translateY(-4px);
        }

        .manga-info {
            flex: 1;
            color: white;
        }

        .manga-name {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        .manga-description {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 24px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
            max-width: 800px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .button-success {
            background-color: var(--md-success);
        }

        .button-success:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        .button-danger {
            background-color: var(--md-danger);
        }

        .button-danger:hover {
            background-color: #d32f2f;
            transform: translateY(-2px);
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--md-text);
        }

        .section-actions {
            display: flex;
            gap: 12px;
            margin-left: auto; /* pushes buttons to the right */
        }

        .sort-button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            background-color: var(--md-surface);
            color: var(--md-text);
            border: 1px solid var(--md-border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sort-button:hover {
            background-color: var(--md-surface-hover);
            border-color: var(--md-accent);
        }

        .chapters-list {
            display: grid;
            gap: 12px;
        }

        .chapter-group {
            background-color: var(--md-surface);
            border: 1px solid var(--md-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .chapter-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--md-border);
        }

        .toggle-section-button {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            background-color: var(--md-surface);
            color: var(--md-text);
            border: 1px solid var(--md-border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-section-button:hover {
            background-color: var(--md-surface-hover);
            border-color: var(--md-accent);
        }

        .toggle-icon {
            transition: transform 0.3s ease;
            font-size: 12px;
        }

        .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }

        .collapsible-section {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 1;
            margin-bottom: 32px;
        }

        .collapsible-section.collapsed {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
        }

        .chapter-item:last-child {
            border-bottom: none;
        }

        .chapter-item:hover {
            background-color: var(--md-surface-hover);
            transform: translateX(4px);
        }

        .chapter-item.read {
            opacity: 0.5;
        }

        .chapter-item.read:hover {
            opacity: 0.7;
        }

        .chapter-item.grouped {
            background-color: var(--md-bg);
        }

        .chapter-item.grouped:hover {
            background-color: var(--md-surface-hover);
        }

        .chapter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--md-surface);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .chapter-header:hover {
            background-color: var(--md-surface-hover);
        }

        .chapter-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .chapter-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .chapter-title {
            flex: 1;
            color: var(--md-text);
            font-size: 15px;
            font-weight: 500;
        }

        .chapter-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--md-accent);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            min-width: 24px;
        }

        .expand-icon {
            color: var(--md-text-secondary);
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .expand-icon.expanded {
            transform: rotate(180deg);
        }

        .chapter-versions {
            display: none;
            border-top: 1px solid var(--md-border);
        }

        .chapter-versions.expanded {
            display: block;
        }

        .chapter-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 13px;
            color: var(--md-text-secondary);
            flex-shrink: 0;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-icon {
            opacity: 0.7;
        }

        .meta-divider {
            width: 1px;
            height: 14px;
            background-color: var(--md-border);
        }

        .warning-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .warning-modal.active {
            display: flex;
        }

        .warning-content {
            background-color: var(--md-surface);
            border: 1px solid var(--md-border);
            border-radius: 8px;
            padding: 32px;
            max-width: 400px;
            text-align: center;
        }

        .warning-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .warning-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--md-text);
            margin-bottom: 12px;
        }

        .warning-text {
            color: var(--md-text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .warning-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--md-text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 1024px) {
            .header-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .manga-info {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .manga-description {
                text-align: center;
            }

            .chapter-main {
                flex-direction: column;
                align-items: flex-start;
            }

            .chapter-meta {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .header {
                min-height: 300px;
            }

            .header-content {
                padding: 30px 16px;
                gap: 20px;
            }

            .cover-image {
                width: 180px;
                height: 270px;
            }

            .manga-name {
                font-size: 28px;
            }

            .manga-description {
                font-size: 14px;
            }

            .main-content {
                padding: 24px 16px;
            }

            .section-title {
                font-size: 20px;
            }

            .action-buttons {
                width: 100%;
            }

            .button {
                flex: 1;
                justify-content: center;
                min-width: 140px;
            }

            .chapter-meta {
                flex-wrap: wrap;
            }
        }

        .meta-link {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .meta-link:hover {
            text-decoration: underline;
        }

        .recommendations {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 16px 0;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .recommendations::-webkit-scrollbar {
            height: 8px;
        }

        .recommendations::-webkit-scrollbar-track {
            background: var(--md-surface);
            border-radius: 4px;
        }

        .recommendations::-webkit-scrollbar-thumb {
            background: var(--md-accent);
            border-radius: 4px;
        }

        .recommendations::-webkit-scrollbar-thumb:hover {
            background: var(--md-accent-hover);
        }

        .recommendations-item {
            position: relative;
            flex: 0 0 auto;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 12px var(--md-shadow);
            transition: all 0.3s ease;
        }

        .recommendations-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 24px var(--md-shadow);
        }

        .recommendations-item img {
            display: block;
            width: 196px;
            height: 276px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .recommendations-item:hover img {
            transform: scale(1.05);
        }

        .subtitle {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            color: #fff;
            padding: 2rem 1rem 1rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.7) 50%, transparent 100%);
            font-size: 14px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            transition: padding 0.3s ease;
        }

        .recommendations-item:hover .subtitle {
            padding-bottom: 1.25rem;
        }

        @media (max-width: 768px) {
            .recommendations {
                gap: 16px;
                padding: 12px 0;
            }

            .recommendations-item img {
                width: 160px;
                height: 225px;
            }

            .subtitle {
                font-size: 13px;
                padding: 1.5rem 0.75rem 0.75rem;
            }
        }
	</style>
</head>
<body>
<div class="header">
	<div class="background-image"></div>
	<div class="header-content">
		<div class="cover-image"></div>
		<div class="manga-info">
			<h1 class="manga-name">{{ name }}</h1>
			<p class="manga-description">{{ description }}</p>
			<div class="action-buttons">
				<button type="button" onclick="push_job()" class="button button-success">
					⬇ Download Manga
				</button>
				<button type="button" onclick="showDeleteWarning()" class="button button-danger">
					🗑 Delete from Database
				</button>
			</div>
		</div>
	</div>
</div>

<div class="main-content">
	<div class="section-header">
		<div class="section-title">Recommendations</div>
		<button class="toggle-section-button" onclick="toggleRecommendations()">
			<span class="toggle-icon" id="recommendations-toggle">▼</span>
		</button>
	</div>
	<div class="collapsible-section" id="recommendations-section">
		<div class="recommendations" id="recommendations-list">
		</div>
	</div>

	<div class="section-header">
		<h2 class="section-title">Chapters</h2>

		<div class="section-actions">
			<button class="sort-button" id="read-status" onclick="set_read_status_for_all()">
				Mark all as read
			</button>
			<button class="sort-button" id="order" onclick="reverse_div()">
				↓ Descending
			</button>
		</div>
	</div>
	<div id="content" class="chapters-list">
		<div class="empty-state">
			<div class="empty-state-icon">📚</div>
			<p>Loading chapters...</p>
		</div>
	</div>
</div>

<div class="warning-modal" id="warningModal">
	<div class="warning-content">
		<div class="warning-icon">⚠️</div>
		<h3 class="warning-title">Delete Manga</h3>
		<p class="warning-text">Are you sure you want to delete this manga from the database? This action cannot be
			undone.</p>
		<div class="warning-buttons">
			<button class="button button-danger" onclick="confirmDelete()">Delete</button>
			<button class="sort-button" onclick="hideDeleteWarning()">Cancel</button>
		</div>
	</div>
</div>

<script>
    const svg_eye = `<svg data-v-9ba4cb7e="" data-v-49be02db="" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="feather feather-eye icon small text-icon-contrast text-undefined flex-shrink-0 cursor-pointer readMarker" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8"></path><circle cx="12" cy="12" r="3"></circle></svg>`
    const svg_crossed_eye = `<svg data-v-9ba4cb7e="" data-v-49be02db="" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" class="icon small text-icon-contrast text-undefined flex-shrink-0 cursor-pointer readMarker opacity-40"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3.001 3.001 0 0 1-5.194-2.098A3 3 0 0 1 9.88 9.88m8.06 8.06A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94zM1 1l22 22"></path></svg>`

	const section = document.getElementById('recommendations-list');

    let all_unread = true
    let cuuid = null

    function push_job() {
        fetch("/downloader/push-job", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                id: "{{muuid}}"
            })
        }).then((res) => {
            setTimeout(() => {
                check_queue()
            }, 200)
        })
    }

    function showDeleteWarning() {
        document.getElementById('warningModal').classList.add('active');
    }

    function hideDeleteWarning() {
        document.getElementById('warningModal').classList.remove('active');
    }

    function confirmDelete() {
        fetch("/manga/delete/{{muuid}}").then(resp => {
            window.location.reload();
        })
    }

    function navigateToChapter(chapterId) {
        window.location.href = "/read/" + chapterId;
    }

    function toggleChapterGroup(groupKey) {
        const versionsDiv = document.getElementById(`versions-${groupKey}`);
        const expandIcon = document.getElementById(`expand-${groupKey}`);

        versionsDiv.classList.toggle('expanded');
        expandIcon.classList.toggle('expanded');
    }

    function groupChapters(chapters) {
        const grouped = {};

        chapters.forEach(chapter => {
            const key = `v${chapter.volume}-c${chapter.chapter}`;
            if (!grouped[key]) {
                grouped[key] = [];
            }
            grouped[key].push(chapter);
        });

        return grouped;
    }

    function createChapterItem(chapter, isGrouped = false) {
        const chapterDiv = document.createElement("div");
        chapterDiv.className = "chapter-item" + (isGrouped ? " grouped" : "");
        chapterDiv.onclick = function () {
            navigateToChapter(chapter.identifier);
        };

        let titleText = "Volume " + chapter.volume + " Chapter " + chapter.chapter;
        if (chapter.title) {
            titleText += " - " + chapter.title;
        }

        const user = chapter.user?.username || "Unknown User";
        const user_id = chapter.user?.id;
        const scanlationGroup = chapter.scanlation_group?.name || "Unknown Group";
        const group_id = chapter.scanlation_group?.id;
        const read_status = chapter.read_status;

        if (read_status) {
            all_unread = false
        }

        chapterDiv.innerHTML = `
            <div class="chapter-main">
                <div class="chapter-viewed-status">${read_status ? svg_crossed_eye : svg_eye}</div>
                <div class="chapter-title">${titleText}</div>
                <div class="chapter-meta">
                    <div class="meta-item">
                        <span class="meta-icon">👤</span>
                        <a href="https://mangadex.org/user/${user_id}" class="meta-link">${user}</a>
                    </div>
                    <div class="meta-divider"></div>
                    <div class="meta-item">
                        <span class="meta-icon">👥</span>
                        <a href="https://mangadex.org/group/${group_id}" class="meta-link">${scanlationGroup}</a>
                    </div>
                </div>
            </div>
        `;

        const statusIcon = chapterDiv.querySelector('.chapter-viewed-status');
        statusIcon.dataset.read = read_status ? "true" : "false";

        statusIcon.addEventListener('click', (event) => {
            const isRead = statusIcon.dataset.read === "true";
            statusIcon.dataset.read = (!isRead).toString();
            statusIcon.innerHTML = !isRead ? svg_crossed_eye : svg_eye;

            fetch("/manga/read-status", {
                method: "POST",
                body: JSON.stringify({
                    "cuuid": chapter.identifier,
                    "read_state": !isRead
                })
            });

            event.stopPropagation();
        });

        return chapterDiv;
    }


    function load_manga_info(reload_recommendation){
        fetch("/manga/{{muuid}}/info").then(response => response.json()).then(data => {
        const contdiv = document.getElementById("content");

        while (contdiv.firstChild) {
            contdiv.removeChild(contdiv.firstChild);
        }

        if (data.length === 0) {
            const emptyState = document.createElement("div");
            emptyState.className = "empty-state";
            emptyState.innerHTML = `
                <div class="empty-state-icon">📖</div>
                <p>No chapters available</p>
            `;
            contdiv.appendChild(emptyState);
			get_recommendation();
            return;
        }

        const grouped = groupChapters(data);

        Object.entries(grouped).forEach(([key, chapters]) => {
            cuuid = chapters[0].identifier
            if (chapters.length === 1) {
                contdiv.appendChild(createChapterItem(chapters[0]));
            } else {
                const groupDiv = document.createElement("div");
                groupDiv.className = "chapter-group";

                const firstChapter = chapters[0];
                let titleText = "Volume " + firstChapter.volume + " Chapter " + firstChapter.chapter;

                const headerDiv = document.createElement("div");
                headerDiv.className = "chapter-header";
                headerDiv.onclick = function () {
                    toggleChapterGroup(key);
                };

                headerDiv.innerHTML = `
                    <div class="chapter-header-left">
                        <div class="chapter-title">${titleText}</div>
                        <span class="chapter-count">${chapters.length}</span>
                    </div>
                    <span class="expand-icon" id="expand-${key}">▼</span>
                `;

                const versionsDiv = document.createElement("div");
                versionsDiv.className = "chapter-versions";
                versionsDiv.id = `versions-${key}`;

                chapters.forEach(chapter => {
                    versionsDiv.appendChild(createChapterItem(chapter, true));
                });

                groupDiv.appendChild(headerDiv);
                groupDiv.appendChild(versionsDiv);
                contdiv.appendChild(groupDiv);

                if (!all_unread) {
                    const read_status_button = document.getElementById("read-status")
                    read_status_button.innerText = "Mark all as not read"
                    read_status_button.onclick = set_unread_status_for_all
                }
            }
        });

        check_queue();
        if(reload_recommendation){
		    get_recommendation();
        }
    });
    }


    function check_queue() {
        fetch("/downloader/contains", {
            method: "POST",
            body: JSON.stringify({"id": "{{muuid}}"})
        }).then(response => response.json()).then(data => {
            if (data.status !== "success") {
                return;
            }
            if (data.data.contains) {
                const btn = document.getElementsByClassName("button-success")[0];
                btn.innerHTML = "⬇ Manga already in queue";
                btn.onclick = function () {
                    window.location.href = "/downloader/manager?from=/manga/{{muuid}}";
                }
            }
        })
    }

    function reverse_div() {
        const orderButton = document.getElementById("order");
        const contdiv = document.getElementById("content");
        const items = Array.from(contdiv.children);
        if (items.length === 0) {
            return;
        }


        items.reverse();
        items.forEach(item => contdiv.appendChild(item));

        if (orderButton.innerText.includes("Descending")) {
            orderButton.innerHTML = "↑ Ascending";
        } else {
            orderButton.innerHTML = "↓ Descending";
        }
    }

    function set_read_status_for_all() {
        if (!cuuid) {
            return;
        }
        fetch("/manga/read-status?all=1", {
            method: "POST",
            body: JSON.stringify({
                "cuuid": cuuid,
                "read_state": 1
            })
        });
        location.reload()
    }

    function set_unread_status_for_all() {
        if (!cuuid) {
            return;
        }
        fetch("/manga/read-status?all=1", {
            method: "POST",
            body: JSON.stringify({
                "cuuid": cuuid,
                "read_state": 0
            })
        });
        location.reload()
    }

    function toggleRecommendations() {
        const section = document.getElementById('recommendations-section');
        const toggleIcon = document.getElementById('recommendations-toggle');

        section.classList.toggle('collapsed');
        toggleIcon.classList.toggle('collapsed');
    }

	async function get_recommendation() {
		section.innerHTML = "";

	    const response = await fetch("/api/manga/{{ muuid }}/recommendation");
	    const data = await response.json();

		for(let key in data){
            section.innerHTML += `
	            <div class="recommendations-item">
	                <img src="/api/manga/cover/${key}" loading="lazy" onclick="window.location.href = '/manga/${key}'">
	                <span class="subtitle">${data[key]}</span>
	            </div>
	        `;
		}
	}

    document.getElementById('warningModal').addEventListener('click', function (event) {
        if (event.target === this) {
            hideDeleteWarning();
        }
    });

    const source = new EventSource("/downloader/stream");

    source.onmessage = (event) => {
	    const data = JSON.parse(event.data);
        if(data.currently_working_on === null){
            return;
        }
	    if(data.currently_working_on.id === "{{ muuid }}") {
            load_manga_info(false);
        }
	}

    load_manga_info(true);
</script>
</body>
</html>
