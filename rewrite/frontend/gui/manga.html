<!DOCTYPE html>
<html>
<head>
	<title>{{ name }}</title>
	<style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            height: auto;
            overflow: hidden;
        }

        .background-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 150%;
            background-image: url("/manga/cover/{{ muuid }}");
            background-size: cover;
            filter: blur(5px);
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            color: #fff;
        }

        .logo {
            display: flex;
            width: 200px;
            height: 200px;
            background-image: url("/manga/cover/{{ muuid }}");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            align-items: center;
            margin-bottom: 20px;
            filter: drop-shadow(0px 0px 20px black);
        }


        .manga-name {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .manga-description {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .button {
            display: inline-block;
            padding: 8px 16px;
            margin-top: 4px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #45a049;
        }

        .button:active {
            background-color: #3e8e41;
        }

        .red-button {
            display: inline-block;
            padding: 8px 16px;
            margin-top: 4px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            background-color: #af4c4c;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .red-button:hover {
            background-color: #a04545;
        }

        .red-button:active {
            background-color: #8e3e3e;
        }

        .image-container {
            max-width: 500px; /* Set the maximum width you want for the image */
            max-height: 300px; /* Set the maximum height you want for the image */
            overflow: hidden; /* Hide any overflowing parts of the image */
        }

        .image-container img {
            width: 100%; /* Make the image occupy 100% of the container's width */
            height: auto; /* Automatically adjust the height to maintain the image's aspect ratio */
            object-fit: contain; /* Maintain the aspect ratio while fitting the image within the container */
        }


        .additional-button {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .chapters {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .chapters a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 250px;
            height: 50px;
            margin-top: 10px;
            color: #333333;
            text-decoration: none;
            background-color: #f2f2f2;
            border: 2px solid #999999;
            font-size: 20px;
            font-weight: bold;
            font-family: sans-serif;
        }

        .chapters a:hover {
            background-color: #dcdcdc;
            color: #000000;
        }

        .chapters a.read {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 250px;
            height: 50px;
            margin-top: 10px;
            color: #333333;
            text-decoration: none;
            background-color: #aaaaaa;
            border: 2px solid #6e6e6e;
            font-size: 20px;
            font-weight: bold;
            font-family: sans-serif;
        }

        .chapters a.read:hover {
            background-color: #505050;
            color: #000000;
        }

        .chapters a:hover {
            background-color: #dcdcdc;
            color: #000000;
        }

        .warning-box {
            display: none;
            border: 2px solid #ff9900;
            background-color: #ffeecc;
            padding: 10px;
            border-radius: 5px;
            width: 300px;
            text-align: center;
            margin: 20px auto;
        }

        .warning-text {
            color: #ff9900;
            font-weight: bold;
        }

	</style>
</head>
<body>
<div class="container">
	<div class="background-image"></div>
	<div class="content">
		<button class="additional-button" onClick="window.location.href='{{ back_redirect }}';">Back</button>
		<div class="logo"></div>
		<div class="manga-name">{{ name }}</div>
		<div class="manga-description">{{ description }}</div>
		<button type="button" onclick="push_job()" class="button">Push manga to download as job</button>
		<button type="button" onclick="confirm()" class="red-button">Delete manga from database</button>
	</div>
</div>

<button class="button" id="order" onclick="reverse_div()">Descending</button>
<div id="content" class="chapters"></div>

<script>
    window.token = '{{ token }}';

    function push_job() {
        fetch("/manga/download/push-job", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                id: "{{muuid}}" // Replace this with the actual value of muuid
            })
        })
    }

    fetch("/manga/{{muuid}}/info").then(response => response.json()).then(data => sortVolumesDescending(data)).then(data => {
        var contdiv = document.getElementById("content");

        for (const key in data) {
            var a = document.createElement("a");

            chapter = data[key]

            // Customize the text content and style of the link
            a.textContent = "Volume " + chapter.volume + " Chapter " + chapter.chapter;

            // Set the link's href attribute
            a.setAttribute('href', "/read/" + key);

            // Append the link and line break to the container div
            contdiv.appendChild(a);
        }
    })

    function sortVolumesDescending(dictionary) {
        // Convert the dictionary into an array of objects
        const array = Object.entries(dictionary).map(([id, value]) => ({
            id: id,
            ...value
        }));

        // Sort the array in descending order based on volumes and chapters
        array.sort((a, b) => {
            if (a.volume === b.volume) {
                const chapterA = parseFloat(a.chapter);
                const chapterB = parseFloat(b.chapter);
                return chapterB - chapterA; // Sort chapters in descending order if volumes are the same
            } else {
                return b.volume - a.volume; // Sort volumes in descending order
            }
        });

        var sorted_dictionary = {}
        array.forEach(element => {
            sorted_dictionary[element.id] = {
                "chapter": element.chapter,
                "volume": element.volume,
                "title": element.title
            }
        })


        return sorted_dictionary;
    }

</html>
