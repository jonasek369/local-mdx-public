<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }}</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #ffffff;
        }

        .container {
            position: relative;
            min-height: 60vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("/manga/cover/{{ muuid }}");
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.6);
            z-index: -1;
            transform: scale(1);
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            max-width: 800px;
            width: 100%;
        }

        .logo {
            width: 300px;
            height: 300px;
            background-image: url("/manga/cover/{{ muuid }}");
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            margin: 0 auto 20px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .manga-name {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        .manga-description {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .button.green {
            background-color: #4CAF50;
        }

        .button.green:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        .button.red {
            background-color: #af4c4c;
        }

        .button.red:hover {
            background-color: #a04545;
            transform: translateY(-2px);
        }

        .additional-button {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            background-color: hsl(12.25 100% 62.55%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 20px;
        }

        .additional-button:hover {
            background-color: hsl(12.5 77.06% 57.25%);
        }

		.additional-button:active {
            background-color: hsl(12.09 52.23% 48.43%);
        }

        .chapters {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .chapters a {
            display: inline-block;
            width: 250px;
            padding: 12px;
            text-align: center;
            color: #333;
            text-decoration: none;
            background-color: #f2f2f2;
            border: 2px solid #999;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .chapters a:hover {
            background-color: #dcdcdc;
            color: #000;
        }

        .chapters a.read {
            background-color: #aaaaaa;
            border-color: #6e6e6e;
        }

        .chapters a.read:hover {
            background-color: #505050;
            color: #000;
        }

        .warning-box {
            display: none;
            border: 2px solid #ff9900;
            background-color: #ffeecc;
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            text-align: center;
            margin: 20px auto;
        }

        .warning-text {
            color: #ff9900;
            font-weight: bold;
        }


        @media (max-width: 768px) {
            .manga-name {
                font-size: 36px;
            }

            .manga-description {
                font-size: 18px;
            }

            .button {
                padding: 10px 20px;
                font-size: 14px;
            }

            .chapters a {
                width: 100%;
                max-width: 250px;
            }

            .logo {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
		<button class="additional-button" onclick="window.location.href='{{ back_redirect }}';">Back</button>
        <div class="background-image"></div>
        <div class="content">
            <div class="logo"></div>
            <h1 class="manga-name">{{ name }}</h1>
            <p class="manga-description">{{ description }}</p>
            <div class="button-group">
                <button type="button" onclick="push_job()" class="button green">Push manga to download as job</button>
                <button type="button" onclick="confirm()" class="button red">Delete manga from database</button>
            </div>
        </div>
    </div>

    <div class="warning-box" id="warningBox">
        <p class="warning-text">Warning: This action cannot be undone.</p>
    </div>

    <button class="button green" id="order" onclick="reverse_div()">Descending</button>
    <div id="content" class="chapters"></div>

<script>
    window.token = '{{ token }}';

    function push_job() {
        fetch("/manga/download/push-job", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                id: "{{muuid}}" // Replace this with the actual value of muuid
            })
        })
    }

    fetch("/manga/{{muuid}}/info").then(response => response.json()).then(data => sortVolumesDescending(data)).then(data => {
        var contdiv = document.getElementById("content");

        for (const key in data) {
            var a = document.createElement("a");

            chapter = data[key]

            // Customize the text content and style of the link
            a.textContent = "Volume " + chapter.volume + " Chapter " + chapter.chapter;

            // Set the link's href attribute
            a.setAttribute('href', "/read/" + key);

            // Append the link and line break to the container div
            contdiv.appendChild(a);
        }
    })

    function sortVolumesDescending(dictionary) {
        // Convert the dictionary into an array of objects
        const array = Object.entries(dictionary).map(([id, value]) => ({
            id: id,
            ...value
        }));

        // Sort the array in descending order based on volumes and chapters
        array.sort((a, b) => {
            if (a.volume === b.volume) {
                const chapterA = parseFloat(a.chapter);
                const chapterB = parseFloat(b.chapter);
                return chapterB - chapterA; // Sort chapters in descending order if volumes are the same
            } else {
                return b.volume - a.volume; // Sort volumes in descending order
            }
        });

        var sorted_dictionary = {}
        array.forEach(element => {
            sorted_dictionary[element.id] = {
                "chapter": element.chapter,
                "volume": element.volume,
                "title": element.title
            }
        })


        return sorted_dictionary;
    }

</script>
</body>
</html>
