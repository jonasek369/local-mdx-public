<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lmdx - Manga Reader</title>
	<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
        {% if darktheme %}
			--md-bg: #1a1a1a;
            --md-surface: #242424;
            --md-surface-hover: #2a2a2a;
            --md-border: #3a3a3a;
            --md-text: #e8e8e8;
            --md-text-secondary: #a0a0a0;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-success: #4caf50;
            --md-danger: #f44336;
            --md-shadow: rgba(0, 0, 0, 0.3);
        {% else %}
			--md-bg: #f5f5f5;
            --md-surface: #ffffff;
            --md-surface-hover: #f9f9f9;
            --md-border: #e0e0e0;
            --md-text: #1a1a1a;
            --md-text-secondary: #666666;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-success: #4caf50;
            --md-danger: #f44336;
            --md-shadow: rgba(0, 0, 0, 0.1);
        {% endif %}
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background-color: var(--md-bg);
            color: var(--md-text);
        }

        .navbar {
            background-color: var(--md-surface);
            border-bottom: 1px solid var(--md-border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--md-accent);
            margin-right: 12px;
        }

        .button {
            background-color: var(--md-accent);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .button:hover {
            background-color: var(--md-accent-hover);
        }

        .button-secondary {
            background-color: transparent;
            color: var(--md-text);
            border: 1px solid var(--md-border);
        }

        .button-secondary:hover {
            background-color: var(--md-surface-hover);
        }

        .search-container {
            flex: 1;
            max-width: 600px;
            margin: 0 24px;
            position: relative;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid var(--md-border);
            border-radius: 6px;
            background-color: var(--md-surface);
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .search-wrapper:focus-within {
            border-color: var(--md-accent);
            box-shadow: 0 0 0 3px rgba(255, 103, 64, 0.1);
        }

        .search-icon {
            padding: 0 12px;
            color: var(--md-text-secondary);
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .search-container input[type="text"] {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            color: var(--md-text);
            outline: none;
            font-size: 15px;
        }

        .search-container input[type="text"]::placeholder {
            color: var(--md-text-secondary);
        }

        .clear-search {
            padding: 0 12px;
            background: transparent;
            border: none;
            color: var(--md-text-secondary);
            cursor: pointer;
            display: none;
            align-items: center;
            transition: color 0.2s;
        }

        .clear-search:hover {
            color: var(--md-text);
        }

        .clear-search.visible {
            display: flex;
        }

        .search-container button[type="submit"] {
            padding: 12px 20px;
            background-color: var(--md-accent);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
            font-weight: 500;
        }

        .search-container button[type="submit"]:hover {
            background-color: var(--md-accent-hover);
        }

        .search-results-dropdown {
            display: none;
            position: absolute;
            background-color: var(--md-surface);
            width: 100%;
            max-height: 500px;
            overflow-y: auto;
            box-shadow: 0 8px 24px var(--md-shadow);
            border-radius: 8px;
            z-index: 1000;
            margin-top: 8px;
            border: 1px solid var(--md-border);
        }

        .search-results-dropdown.show {
            display: block;
        }

        .search-results-header {
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--md-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--md-border);
            background-color: rgba(255, 103, 64, 0.05);
        }

        .search-results-dropdown a {
            display: flex;
            align-items: flex-start;
            padding: 12px 16px;
            text-decoration: none;
            color: var(--md-text);
            border-bottom: 1px solid var(--md-border);
            transition: background-color 0.2s;
        }

        .search-results-dropdown a:last-child {
            border-bottom: none;
        }

        .search-results-dropdown a:hover {
            background-color: var(--md-surface-hover);
        }

        .search-result-image {
            width: 56px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 14px;
            flex-shrink: 0;
            border: 1px solid var(--md-border);
        }

        .search-result-info {
            flex: 1;
            min-width: 0;
        }

        .search-result-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-result-meta {
            font-size: 12px;
            color: var(--md-text-secondary);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-result-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rating-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .rating-safe {
            background-color: var(--md-success);
            color: white;
        }

        .rating-suggestive {
            background-color: #ff8c00;
            color: white;
        }

        .rating-nsfw {
            background-color: var(--md-danger);
            color: white;
        }

        .rating-erotica {
            background-color: var(--md-danger);
            color: white;
        }

        .no-results {
            padding: 32px 16px;
            text-align: center;
            color: var(--md-text-secondary);
            font-size: 14px;
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .loading-spinner {
            padding: 24px;
            text-align: center;
            color: var(--md-text-secondary);
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--md-border);
            border-top-color: var(--md-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .login-button {
            background-color: transparent;
            color: var(--md-text);
            padding: 8px 16px;
            border: 1px solid var(--md-border);
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .login-button:hover {
            background-color: var(--md-surface-hover);
        }

        .main-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--md-text);
            margin-bottom: 24px;
        }

        .manga-card {
            background-color: var(--md-surface);
            border: 1px solid var(--md-border);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            padding: 24px;
            transition: all 0.2s;
            cursor: pointer;
            min-height: 380px;
        }

        .manga-card:hover {
            border-color: var(--md-accent);
            box-shadow: 0 4px 12px var(--md-shadow);
        }

        .manga-card-image {
            flex-shrink: 0;
            width: 220px;
            height: 330px;
            margin-right: 24px;
        }

        .manga-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .manga-card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .manga-card h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--md-text);
        }

        .genre-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tag {
            background-color: var(--md-bg);
            color: var(--md-text);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--md-border);
        }

        .tag.rating-suggestive {
            background-color: #ff8c00;
            color: white;
            border-color: #ff8c00;
        }

        .tag.rating-nsfw {
            background-color: var(--md-danger);
            color: white;
            border-color: var(--md-danger);
        }

        .description {
            color: var(--md-text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
        }

        .authors {
            color: var(--md-text-secondary);
            font-size: 13px;
            font-style: italic;
        }

        .navigation-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            gap: 16px;
        }

        .navigation-controls button {
            background-color: var(--md-surface);
            color: var(--md-text);
            padding: 10px 20px;
            border: 1px solid var(--md-border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
        }

        .navigation-controls button:hover {
            background-color: var(--md-surface-hover);
            border-color: var(--md-accent);
        }

        .navigation-controls span {
            font-size: 14px;
            font-weight: 600;
            color: var(--md-text-secondary);
            padding: 10px 20px;
            background-color: var(--md-surface);
            border: 1px solid var(--md-border);
            border-radius: 4px;
        }

        @media (max-width: 1024px) {
            .manga-card {
                flex-direction: column;
                align-items: center;
                min-height: auto;
            }

            .manga-card-image {
                width: 200px;
                height: 300px;
                margin-right: 0;
                margin-bottom: 20px;
            }

            .search-container {
                margin: 0 16px;
                max-width: 400px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
                gap: 12px;
                padding: 12px 16px;
            }

            .nav-left {
                order: 1;
                width: 100%;
                justify-content: space-between;
            }

            .search-container {
                order: 2;
                width: 100%;
                margin: 0;
                max-width: none;
            }

            .login-button {
                order: 3;
            }

            .main-content {
                padding: 20px 16px;
            }

            .section-title {
                font-size: 20px;
            }

            .manga-card {
                padding: 16px;
            }

            .manga-card-image {
                width: 160px;
                height: 240px;
            }

            .navigation-controls {
                flex-wrap: wrap;
            }

            .navigation-controls button,
            .navigation-controls span {
                flex: 1;
                min-width: 100px;
                text-align: center;
            }
        }

        /* Custom scrollbar for dropdown */
        .search-results-dropdown::-webkit-scrollbar {
            width: 8px;
        }

        .search-results-dropdown::-webkit-scrollbar-track {
            background: var(--md-surface);
        }

        .search-results-dropdown::-webkit-scrollbar-thumb {
            background: var(--md-border);
            border-radius: 4px;
        }

        .search-results-dropdown::-webkit-scrollbar-thumb:hover {
            background: var(--md-text-secondary);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

		.latest-updates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            align-items: start;
        }

        /* Each column (list of updates) */
        .latest-updates {
            background-color: var(--md-surface);
            border: 1px solid var(--md-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Individual update row */
        .latest-updates-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .latest-updates-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
			cursor: pointer;
        }

        /* Cover image */
        .latest-updates-item img {
            width: 48px;
            height: 68px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* Text content */
        .latest-updates-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            line-height: 1.2;
        }

        .latest-updates-content h1 {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .latest-updates-content .chapter {
            font-size: 0.85rem;
            color: #ccc;
            margin: 2px 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

		.latest-updates-content,
		.group,
		.group-clickable {
		  font-size: 0.8rem;
		  color: #aaa;
		  margin: 2px 0 0;
		  white-space: nowrap;
		  overflow: hidden;
		  text-overflow: ellipsis;
		}

		.group-clickable:hover {
			background-color: rgba(255, 255, 255, 0.05);
			cursor: pointer;
		}

        .latest-updates-content .time {
            font-size: 0.75rem;
            color: #777;
            margin-top: 2px;
        }

		@media (max-width: 1600px) {
		    .latest-updates-grid .latest-updates:nth-child(4) {
		        display: none;
		    }
		}

		@media (max-width: 1200px) {
		    .latest-updates-grid .latest-updates:nth-child(3) {
		        display: none;
		    }
		}

		@media (max-width: 800px) {
		    .latest-updates-grid .latest-updates:nth-child(2) {
		        display: none;
		    }
		}
	</style>
</head>

<body>
<!-- Navbar -->
<div class="navbar">
	<div class="nav-left">
		<div class="logo">LMDX</div>
		<button onClick="redirect_to_download_manager()" class="button button-secondary">Download Manager</button>
		<button onClick="redirect_to_library()" class="button button-secondary">Library</button>
		<button onClick="redirect_to_updates()" class="button button-secondary">Updates</button>
	</div>

	<div class="search-container">
		<div class="search-wrapper">
			<div class="search-icon">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<circle cx="11" cy="11" r="8"></circle>
					<path d="m21 21-4.35-4.35"></path>
				</svg>
			</div>
			<input type="text" id="searchInput" placeholder="Search manga titles...">
			<button class="clear-search" id="clearSearch">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<line x1="18" y1="6" x2="6" y2="18"></line>
					<line x1="6" y1="6" x2="18" y2="18"></line>
				</svg>
			</button>
			<button type="submit" onclick="searchManga()">Search</button>
		</div>
		<div class="search-results-dropdown" id="searchResultsDropdown"></div>
	</div>

	{% block content %}
	{% if login == 1 %}
	<button class="login-button">{{ name }}</button>
	{% else %}
	<button onClick="window.location.href = '/auth?from=/'" class="login-button">Login</button>
	{% endif %}
	{% endblock content %}
</div>

<!-- Main Content -->
<div class="main-content">
	<h2 class="section-title">Popular New Titles</h2>

	<!-- Manga Card -->
	<div class="manga-card" onclick="to_manga()">
		<div class="manga-card-image">
			<img src="" alt="Book Cover" id="cover-art" fetchpriority="high">
		</div>
		<div class="manga-card-content">
			<h3 id="manga-title">Loading...</h3>
			<div class="genre-tags" id="genre-tags">
				<span class="tag">Action</span>
				<span class="tag">Adventure</span>
				<span class="tag">Fantasy</span>
			</div>
			<p class="description" id="description">
				Loading manga information...
			</p>
			<p class="authors" id="authors"></p>
		</div>
	</div>

	<!-- Navigation Controls -->
	<div class="navigation-controls">
		<button id="manga-sub">← Previous</button>
		<span id="number">NO. 1</span>
		<button id="manga-add">Next →</button>
	</div>

	<!-- Latest Updates -->
	<h2 class="section-title">Latest Updates</h2>
	<div class="latest-updates-grid">
		<div class="latest-updates"></div>
		<div class="latest-updates"></div>
		<div class="latest-updates"></div>
		<div class="latest-updates"></div>
	</div>
</div>

<script>
    function redirect_to_download_manager() {
        window.location.href ="/manga/download/manager";
    }

    function redirect_to_library() {
        window.location.href = "/library";
    }

    function redirect_to_updates() {
        window.location.href = "/updates";
    }

    let currentIndex = 1;
    const title = document.getElementById("manga-title");
    const description = document.getElementById("description");
    const authors = document.getElementById("authors");
    const image = document.getElementById("cover-art");
    const number = document.getElementById("number");
    const genreTags = document.getElementById("genre-tags");
    const searchResultsDropdown = document.getElementById("searchResultsDropdown");
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    let searchTimeout;

    // Show/hide clear button
    searchInput.addEventListener('input', function () {
        if (this.value.length > 0) {
            clearSearch.classList.add('visible');
        } else {
            clearSearch.classList.remove('visible');
            searchResultsDropdown.classList.remove('show');
        }

        // Debounce search
        clearTimeout(searchTimeout);
        if (this.value.trim().length > 0) {
            searchTimeout = setTimeout(() => searchManga(), 300);
        }
    });

    // Clear search
    clearSearch.addEventListener('click', function () {
        searchInput.value = '';
        clearSearch.classList.remove('visible');
        searchResultsDropdown.classList.remove('show');
        searchInput.focus();
    });

    // Search on Enter key
    searchInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            searchManga();
        }
    });

    function searchManga() {
        const searchTerm = searchInput.value.trim();

        if (!searchTerm) {
            searchResultsDropdown.classList.remove('show');
            return;
        }

        // Show loading state
        searchResultsDropdown.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p>Searching...</p></div>';
        searchResultsDropdown.classList.add('show');

        // Fetch search results
        fetch("/api/search/manga", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({searchTerm: searchTerm})
        })
            .then(response => response.json())
            .then(data => {
                searchResultsDropdown.innerHTML = '';

                if (data.length === 0) {
                    searchResultsDropdown.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">📚</div>
                        <p>No manga found matching "${searchTerm}"</p>
                    </div>
                `;
                } else {
                    // Add header
                    const header = document.createElement('div');
                    header.className = 'search-results-header';
                    header.textContent = `Found ${data.length} result${data.length !== 1 ? 's' : ''}`;
                    searchResultsDropdown.appendChild(header);

                    // Populate dropdown with results
                    data.forEach(function (result) {
                        const resultItem = document.createElement('a');
                        resultItem.href = "/manga/" + result.id;

                        const img = document.createElement('img');
                        img.className = 'search-result-image';
                        img.src = "/api/manga/cover/" + result.id + "?size=256";
                        img.alt = result.attributes.title || "Manga Cover";
                        img.loading = "eager"
                        img.decoding = "async"
                        img.onerror = function () {
                            this.style.display = 'none';
                        };

                        const info = document.createElement('div');
                        info.className = 'search-result-info';

                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'search-result-title';
                        titleDiv.textContent = result.attributes.title || "Untitled";

                        const meta = document.createElement('div');
                        meta.className = 'search-result-meta';

                        // Add rating badge
                        const rating = result.attributes.contentRating;
                        if (rating) {
                            const ratingBadge = document.createElement('span');
                            if (rating !== "safe" && rating !== "suggestive" && rating !== "erotica") {
                                ratingBadge.className = `rating-badge rating-nsfw`;
                                ratingBadge.textContent = "mature";
                            } else {
                                ratingBadge.className = `rating-badge rating-${rating}`;
                                ratingBadge.textContent = rating;
                            }
                            meta.appendChild(ratingBadge);
                        }

                        // Add publication year if available
                        if (result.attributes.year) {
                            const year = document.createElement('span');
                            year.textContent = `📅 ${result.attributes.year}`;
                            meta.appendChild(year);
                        }

                        info.appendChild(titleDiv);
                        info.appendChild(meta);

                        resultItem.appendChild(img);
                        resultItem.appendChild(info);
                        searchResultsDropdown.appendChild(resultItem);
                    });
                }

                searchResultsDropdown.classList.add('show');
            })
            .catch(error => {
                console.error('Error:', error);
                searchResultsDropdown.innerHTML = `
                <div class="no-results">
                    <div class="no-results-icon">⚠️</div>
                    <p>Error loading search results</p>
                </div>
            `;
                searchResultsDropdown.classList.add('show');
            });
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function (event) {
        const searchContainer = document.querySelector('.search-container');
        const dropdown = document.getElementById('searchResultsDropdown');
        if (!searchContainer.contains(event.target)) {
            dropdown.classList.remove('show');
        }
    });

	fetch("/auth/check").then(response => response.json()).then(data => {
        const login_button = document.getElementsByClassName("login-button")[0]
        if (data.status === "ok") {
            login_button.innerText = "Logged in"
        } else {
            login_button.innerText = "Missing credentials"
        }
    })


    let popular_manga = null;
    fetch("/api/popular-new-titles").then(response => response.json()).then(data => {
        popular_manga = data
        updatePopularManga()
    })


	function get_relationship_type(relationships, type){
        for (let i = 0; i < relationships.length; i++) {
			if(relationships[i].type === type){
                return relationships[i];
			}
        }
	}

    function timeAgo(isoString) {
		const date = new Date(isoString);
		const now = new Date();
		const diffMs = now - date;
		const diffSec = Math.floor(diffMs / 1000);
		const diffMin = Math.floor(diffSec / 60);
		const diffHr = Math.floor(diffMin / 60);
		const diffDay = Math.floor(diffHr / 24);

		if (diffSec < 60) return "just now";
		if (diffMin < 60) return `${diffMin} minute${diffMin !== 1 ? "s" : ""} ago`;
		if (diffHr < 24) return `${diffHr} hour${diffHr !== 1 ? "s" : ""} ago`;
		if (diffDay < 7) return `${diffDay} day${diffDay !== 1 ? "s" : ""} ago`;

		return date.toLocaleDateString();
	}

	fetch("/api/latest-updated-chapters")
	    .then(response => response.json())
	    .then(data => {
        const latestUpdatedContainers = document.getElementsByClassName("latest-updates");
        let chapterIndex = 0;

        for (let containerIdx = 0; containerIdx < latestUpdatedContainers.length; containerIdx++) {
            let container = latestUpdatedContainers[containerIdx];
            let htmlContent = "";

            for (let chaptersPerElement = 0; chaptersPerElement < 6; chaptersPerElement++) {
                if (chapterIndex >= data.length) break;

                let mangaRl = get_relationship_type(data[chapterIndex].relationships, "manga");
                let groupRl = get_relationship_type(data[chapterIndex].relationships, "scanlation_group");

                let volChap = "";
                if (data[chapterIndex].attributes.volume) volChap += `Vol. ${data[chapterIndex].attributes.volume} `;
                if (data[chapterIndex].attributes.chapter) volChap += `Ch. ${data[chapterIndex].attributes.chapter}`;

                let groupHTML = "No group";
                let groupClass = "group";
                let groupOnClick = "";
                if (groupRl) {
                    groupHTML = groupRl.attributes.name;
                    groupClass = "group-clickable";
                    groupOnClick = `onclick="event.stopPropagation(); window.location.href ='https://mangadex.org/group/${groupRl.id}';"`;
                }

                htmlContent += `
                    <div class="latest-updates-item" onclick="window.location.href = '/manga/${mangaRl.id}'">
                        <img src="/api/manga/cover/${mangaRl.id}?size=256" alt="${mangaRl.attributes.title || 'Untitled'}" loading="lazy" decoding="async">
                        <div class="latest-updates-content">
                            <h1>${mangaRl.attributes.title || "Untitled"}</h1>
                            <p class="chapter">${volChap}</p>
                            <p class="${groupClass}" ${groupOnClick}>${groupHTML}</p>
                            <span class="time">${timeAgo(data[chapterIndex].attributes.readableAt)}</span>
                        </div>
                    </div>
                `;

                chapterIndex++;
            }

            container.innerHTML = htmlContent;
        }
    });

    document.getElementById('manga-sub').addEventListener('click', (event) => {
        event.stopPropagation();
        clearInterval(scroll_interval)
        currentIndex = currentIndex - 1;
        if (currentIndex <= 0) {
            currentIndex = 10;
        }
        updatePopularManga()
    })

    document.getElementById('manga-add').addEventListener('click', (event) => {
        event.stopPropagation();
        clearInterval(scroll_interval)
        currentIndex = currentIndex + 1;
        if (currentIndex > 10) {
            currentIndex = 1;
        }
        updatePopularManga()
    })

    function to_manga() {
		window.location.href = "/manga/" + popular_manga[currentIndex - 1].id;
    }

    function updatePopularManga() {
        if (popular_manga === null) {
            return null
        }
        while (genreTags.firstChild) {
            genreTags.removeChild(genreTags.firstChild);
        }
        image.src = "/api/manga/cover/" + popular_manga[currentIndex - 1].id + "?size=512";
        image.loading="eager"
        image.decoding="async"
        title.innerText = popular_manga[currentIndex - 1].attributes.title;
        description.innerText = popular_manga[currentIndex - 1].attributes.description;

        const relationships = popular_manga[currentIndex - 1].relationships;
        const authorNames = relationships
            .filter(r => (["author", "artist"].includes(r.type) && r.attributes?.name))
            .sort((a, b) => {
                if (a.type === b.type) return 0;
                return a.type === "artist" ? -1 : 1;
            })
            .map(r => r.attributes.name);

        authors.innerText = authorNames.join(", ");

        number.innerText = "NO. " + currentIndex.toString()

        let rating = popular_manga[currentIndex - 1].attributes.contentRating;
        if (rating !== "safe") {
            let tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = popular_manga[currentIndex - 1].attributes.contentRating.toUpperCase();

            if (rating === "suggestive") {
                tag.classList.add("rating-suggestive");
            } else {
                tag.classList.add("rating-nsfw");
            }
            genreTags.appendChild(tag);
        }

        popular_manga[currentIndex - 1].attributes.tags.forEach(tag => {
            if (tag.attributes.group !== "genre" || genreTags.children.length === 5) {
                return
            }
            let tagElement = document.createElement("span");
            tagElement.className = "tag";
            tagElement.textContent = tag.attributes.name;
            genreTags.appendChild(tagElement);
        })
    }

    const scroll_interval = setInterval(function () {
        currentIndex = currentIndex + 1;
        if (currentIndex > 10) {
            currentIndex = 1;
        }
        updatePopularManga()
    }, 10000)
</script>
</body>
