<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Navbar with Login Button and Search Bar</title>
	<style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }

        .search-container {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .search-container input[type=text] {
            padding: 10px;
            margin: 0;
            width: 70%;
            border: none;
            border-radius: 5px 0 0 5px;
        }

        .search-container button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }

        .search-container button:hover {
            background-color: #45a049;
        }

        .search-container button:active {
            background-color: #3e8e41;
        }

        .login-container {
            display: flex;
            align-items: center;
        }

        .login-button {
            padding: 10px 20px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .button {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #45a049;
        }

        .button:active {
            background-color: #3e8e41;
        }

        /* Responsive styles */
        @media screen and (max-width: 600px) {
            .search-container input[type=text] {
                width: 100%;
            }
        }

        .search-results-dropdown {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 50%;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            margin-top: 35px;

        }

        .search-results-dropdown a {
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            color: black;
        }

        .search-results-dropdown a:hover {
            background-color: #f1f1f1;
        }

	</style>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
<div class="navbar">
	<button onClick="redirect_to_download_manager()" class="button">Download manager</button>
	<button onClick="redirect_to_library()" class="button">Library</button>
	<button onClick="redirect_to_updates()" class="button">Updates</button>

	<div class="search-container">
		<input type="text" id="searchInput" placeholder="Search...">
		<button type="submit" onclick="searchManga()">Search</button>
		<div class="search-results-dropdown" id="searchResultsDropdown"></div>
	</div>
	{% block content %}
	{% if login == 1 %}
	<button class="login-button">{{ name }}</button>
	{% else %}
	<div class="login-container">
		<button onClick="document.location.href='/login?from=/'" class="login-button">Login</button>
	</div>
	{% endif %}
	{% endblock content %}
</div>

<div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-6">
	<h2 class="text-xl font-semibold text-gray-700">Popular New Titles</h2>

	<div class="mt-4 flex items-center space-x-6 h-[400px]" onclick="to_manga()">
		<!-- Book Cover -->
		<img src="" alt="Book Cover" class="w-[193px] h-[276px] object-cover rounded-lg shadow-md" id="cover-art">

		<!-- Book Details -->
		<div>
			<h3 class="text-2xl font-bold" id="manga-title">Sample Title</h3>

			<!-- Dynamic Genre Tags -->
			<ul id="genre-tags" class="flex space-x-2 mt-2">

			</ul>

			<p class="mt-2 text-gray-700 text-sm h-[200px] overflow-hidden" id="description">
				Sample Description
			</p>
			<p class="mt-3 italic text-gray-500" id="authors">Sample Author</p>
		</div>
	</div>

	<!-- Navigation Controls -->
	<div class="flex justify-between items-center mt-4">
		<button class="bg-gray-200 px-3 py-1 rounded-lg text-gray-700" id="manga-sub">&larr;</button>
		<span class="text-gray-600" id="number">NO. 7</span>
		<button class="bg-gray-200 px-3 py-1 rounded-lg text-gray-700" id="manga-add">&rarr;</button>
	</div>
</div>

<script>
    function redirect_to_download_manager() {
        window.location.replace("/manga/download/manager");
    }

    function redirect_to_library() {
        window.location.replace("/manga/library");
    }

    function redirect_to_updates() {
        window.location.replace("/updates");
    }


    let currentIndex = 1;
    const title = document.getElementById("manga-title");
    const description = document.getElementById("description");
    const authors = document.getElementById("authors");
    const image = document.getElementById("cover-art");
    const number = document.getElementById("number");
    const genreTags = document.getElementById("genre-tags");
    const cached_cover_arts = {}

    function searchManga() {
        var searchResultsDropdown = document.getElementById("searchResultsDropdown");

        while (searchResultsDropdown.firstChild) {
            searchResultsDropdown.removeChild(searchResultsDropdown.firstChild);
        }

        // Display search results dropdown
        searchResultsDropdown.style.display = "block";
        fetch("/search/manga", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({searchTerm: document.getElementById('searchInput').value})
        }).then(response => response.json())
            .then(data => {
                data.forEach(function (result) {
                    console.log(result)
                    var resultItem = document.createElement("a");
                    resultItem.href = "/manga/" + result["id"];
                    var image = document.createElement("img");
                    image.src = "/manga/cover/" + result["id"] + "?small=1";
                    image.alt = "Result Image";
                    image.width = 51;
                    image.height = 80;

                    var text = document.createElement("span");
                    text.textContent = result["attributes"]["title"]["en"];

                    resultItem.appendChild(image);
                    resultItem.appendChild(text);
                    searchResultsDropdown.appendChild(resultItem);
                });
            })
            .catch(error => {
                console.error('Error:', error); // Handle any errors here
            });
    }

    document.getElementById('searchInput').onkeydown = function (event) {

        if (event.keyCode === 13) {
            searchManga()
        } else if (event.keyCode === 8) {
            if (document.getElementById("searchInput").value.length === 0) {
                let searchResultsDropdown = document.getElementById("searchResultsDropdown");
                while (searchResultsDropdown.firstChild) {
                    searchResultsDropdown.removeChild(searchResultsDropdown.firstChild);
                }
                searchResultsDropdown.style.display = "none";
            }
        }
    }

    let popular_manga = null;
    fetch("popular-new-titles").then(response => response.json()).then(data => {
        popular_manga = data
        cache_cover_art()
        updateManga()
    })
    document.getElementById('manga-sub').addEventListener('click', (event) => {
        currentIndex = currentIndex - 1;
        if (currentIndex <= 0) {
            currentIndex = 10;
        }
        updateManga()
    })
    document.getElementById('manga-add').addEventListener('click', (event) => {
        currentIndex = currentIndex + 1;
        if (currentIndex > 10) {
            currentIndex = 1;
        }
        updateManga()
    })

    function to_manga() {
        window.location.replace("/manga/" + popular_manga[currentIndex - 1]["id"]);
    }

    function cache_cover_art() {
        popular_manga.forEach(manga => {
            const img = new Image();
            img.src = "/manga/cover/" + manga.id;
            img.onerror = function () {
                const maxRetries = 5;
                let retryCount = parseInt(img.getAttribute("data-retry-count"));

                if (retryCount < maxRetries) {
                    retryCount++;
                    img.setAttribute("data-retry-count", retryCount);

                    setTimeout(() => {
                        console.log(`Retrying ${img.src}, attempt ${retryCount}`);
                        img.src = "/manga/cover/" + manga.id;
                    }, 1000 * retryCount); // Exponential backoff
                } else {
                    console.error(`Failed to load ${img.src} after ${maxRetries} retries.`);
                }
            };
            cached_cover_arts[manga.id] = img
        })
        console.log(cached_cover_arts)
        updateManga()
    }

    function updateManga() {
        if (popular_manga === null) {
            return null
        }
        while (genreTags.firstChild) {
            genreTags.removeChild(genreTags.firstChild);
        }
        image.src = cached_cover_arts[popular_manga[currentIndex - 1]["id"]].src
        title.innerText = popular_manga[currentIndex - 1]["attributes"]["title"]["en"];
        description.innerText = popular_manga[currentIndex - 1]["attributes"]["description"]["en"]

        authors.innerText = ""; // TODO: add

        number.innerText = "NO. " + currentIndex.toString()

        let rating = popular_manga[currentIndex - 1]["attributes"]["contentRating"];
        if (rating !== "safe") {
            let li = document.createElement("li");
            li.textContent = popular_manga[currentIndex - 1]["attributes"]["contentRating"];
            switch (rating) {
                case "suggestive":
                    li.classList.add("px-2", "py-1", "rounded-lg", "text-xs", "font-medium");
                    li.style.backgroundColor = "rgb(218, 117, 0)";
                    li.style.color = "rgb(255, 255, 255)";
                    break
                default:
                    li.classList.add("px-2", "py-1", "rounded-lg", "text-xs", "font-medium");
                    li.style.backgroundColor = "rgb(255, 64, 64)";
                    li.style.color = "rgb(255, 255, 255)";
                    break
            }
            genreTags.appendChild(li);
        }

        popular_manga[currentIndex - 1]["attributes"]["tags"].forEach(tag => {
            if (tag["attributes"]["group"] !== "genre" || genreTags.children.length === 4) {
                return
            }
            let li = document.createElement("li");
            li.textContent = tag["attributes"]["name"]["en"];
            li.classList.add("bg-gray-200", "px-2", "py-1", "rounded-lg", "text-xs", "font-medium");
            genreTags.appendChild(li);
        })
    }
</script>
</body>

</html>
