<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Updates</title>
	<style>
        .button {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #45a049;
        }

        .button:active {
            background-color: #3e8e41;
        }

        #updates {
            display: flex;
            flex-direction: column; /* Stack items vertically */
            justify-content: center;
            align-items: center;
        }

        #updates .update {
            width: 500px;
            height: 100px;
            display: flex;
            align-items: center;
            margin-top: 10px;
            color: #333333;
            text-decoration: none;
            background-color: #f2f2f2;
            border: 2px solid #999999;
            overflow: hidden;
        }

        #updates .update img {
            max-width: 180px;
            max-height: 80px;
            margin-left: 10px;
            object-fit: cover;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0px 0px 5px black);
        }

        #updates .update .name {
            align-self: flex-start;
            margin-top: 10px;
            margin-left: 5px;

            font-size: 28px;
            font-weight: bold;
            font-family: sans-serif;

            white-space: nowrap;
        }

        #updates .update .chapter {
            align-self: flex-start;
            margin-top: 50px;
            margin-left: 10px;

            font-size: 16px;
            font-weight: bold;
            font-family: sans-serif;


            overflow: hidden;
            text-overflow: clip;
        }

	</style>
</head>
<body>
<button class="button" onClick="window.location.href='/';">Back</button>
<div id="updates">
</div>
<div>
	<button class="button" onclick="change_page(-1)">&larr;</button>
	<a id="page-counter">1</a>
	<button class="button" onclick="change_page(1)">&rarr;</button>
</div>
<script>
    window.token = '{{ token }}';

    let page = 1;
    let offset = 0;

    function change_page(add) {
        if (add === 1) {
            page += add
            update_page()
        }
        if (page >= 2 && add === -1) {
            page += add
            update_page()
        }
    }

    function update_page() {
        document.getElementById('page-counter').innerHTML = page;
        fetch(`/updates/data?limit=32&offset=${page * 32}`, {
            method: "GET",
        }).then(res => res.json()).then(data => {
            console.log(data);
		})
    }

    update_page()
</script>
</body>
</html>
