<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            {% if darktheme %}
            --md-bg: #1a1a1a;
            --md-surface: #242424;
            --md-surface-hover: #2a2a2a;
            --md-border: #3a3a3a;
            --md-text: #e8e8e8;
            --md-text-secondary: #a0a0a0;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-success: #4caf50;
            --md-danger: #f44336;
            --md-shadow: rgba(0, 0, 0, 0.5);
            {% else %}
            --md-bg: #f5f5f5;
            --md-surface: #ffffff;
            --md-surface-hover: #f9f9f9;
            --md-border: #e0e0e0;
            --md-text: #1a1a1a;
            --md-text-secondary: #666666;
            --md-accent: #ff6740;
            --md-accent-hover: #ff7d5c;
            --md-success: #4caf50;
            --md-danger: #f44336;
            --md-shadow: rgba(0, 0, 0, 0.1);
            {% endif %}
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background-color: var(--md-bg);
            color: var(--md-text);
            min-height: 100vh;
        }

        .header {
            background-color: var(--md-surface);
            border-bottom: 1px solid var(--md-border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: 600;
        }


        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .manga-update {
            background-color: var(--md-surface);
            border: 1px solid var(--md-border);
            border-radius: 6px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .manga-update:hover {
            border-color: var(--md-accent);
        }

        .manga-header {
            display: flex;
            gap: 16px;
            padding: 16px;
            border-bottom: 1px solid var(--md-border);
            cursor: pointer;
        }

        .manga-cover {
            width: 80px;
            height: 112px;
            flex-shrink: 0;
            border-radius: 4px;
            object-fit: cover;
            background-color: var(--md-surface-hover);
        }

        .manga-info {
            flex: 1;
            min-width: 0;
        }

		.download-btn {
            padding: 6px 12px;
            background-color: transparent;
            color: var(--md-accent);
            border: 1px solid var(--md-accent);
            border-radius: 20px; /* Pill shape */
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            flex-shrink: 0;
            white-space: nowrap;
            align-self: center; /* Centers it vertically in the flex row */
        }

        .download-btn:hover {
            background-color: var(--md-accent);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px var(--md-shadow);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .manga-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--md-text);
            text-decoration: none;
            display: block;
        }

        .manga-title:hover {
            color: var(--md-accent);
        }

        .manga-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--md-text-secondary);
        }

        .chapters-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .chapters-list.expanded {
            max-height: 2000px;
        }

        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--md-border);
            transition: background-color 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: var(--md-text);
        }

        .chapter-item:last-child {
            border-bottom: none;
        }

        .chapter-item:hover {
            background-color: var(--md-surface-hover);
        }

        .chapter-left {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .chapter-flag {
            width: 24px;
            height: 18px;
            background-color: var(--md-border);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .chapter-info {
            flex: 1;
            min-width: 0;
        }

        .chapter-title-line {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chapter-meta {
            font-size: 12px;
            color: var(--md-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chapter-right {
            display: flex;
            gap: 12px;
            align-items: center;
            color: var(--md-text-secondary);
            font-size: 12px;
            flex-shrink: 0;
        }

        .chapter-pages {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .expand-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            background-color: transparent;
            border: none;
            color: var(--md-accent);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.2s;
        }

        .expand-btn:hover {
            background-color: var(--md-surface-hover);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
            padding: 20px;
        }

        .page-btn {
            padding: 8px 16px;
            background-color: var(--md-surface);
            color: var(--md-text);
            border: 1px solid var(--md-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .page-btn:hover:not(:disabled) {
            background-color: var(--md-surface-hover);
            border-color: var(--md-accent);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-number {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--md-text);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--md-text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--md-border);
            border-top-color: var(--md-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header-content {
                padding: 0 16px;
            }

            .container {
                padding: 16px;
            }

            .manga-header {
                padding: 12px;
            }

            .manga-cover {
                width: 60px;
                height: 84px;
            }

            .manga-title {
                font-size: 16px;
            }

            .manga-stats {
                flex-direction: column;
                gap: 4px;
            }

			.download-btn {
                width: auto;      /* Prevents full-width on mobile */
                margin-top: 0;     /* Keeps it aligned with the header */
                padding: 4px 10px; /* Slightly smaller on mobile */
                font-size: 11px;
            }

            .chapter-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .chapter-right {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1 class="header-title">Latest Updates</h1>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <div>Loading updates...</div>
        </div>
        <div id="updates-container"></div>
        <div class="pagination">
            <button class="page-btn" id="prev-page" onclick="changePage(-1)">← Previous</button>
            <span class="page-number" id="page-counter">Page 1</span>
            <button class="page-btn" id="next-page" onclick="changePage(1)">Next →</button>
        </div>
    </div>

    <script>
        window.token = '{{ token }}';
        let currentPage = 1;
        const itemsPerPage = 20;

        function changePage(direction) {
            if (direction === -1 && currentPage <= 1) return;
            currentPage += direction;
            updatePage();
        }

        async function updatePage() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('updates-container');
            const pageCounter = document.getElementById('page-counter');
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');

            loading.style.display = 'block';
            container.innerHTML = '';

            try {
                const offset = (currentPage - 1) * itemsPerPage;
                const response = await fetch(`/updates/data?limit=${itemsPerPage}&offset=${offset}`);
                const data = await response.json();

                loading.style.display = 'none';

                if (!data.data || data.data.length === 0) {
                    container.innerHTML = '<div class="loading">No updates found.</div>';
                    return;
                }

                await createUpdateElements(data);

                pageCounter.textContent = `Page ${currentPage}`;
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = data.data.length < itemsPerPage;

            } catch (error) {
                loading.style.display = 'none';
                container.innerHTML = '<div class="loading">Error loading updates.</div>';
                console.error('Error loading updates:', error);
            }
        }

        function getMuuidFromChapter(chapter) {
            for (let relationship of chapter.relationships) {
                if (relationship.type === "manga") {
                    return relationship.id;
                }
            }
            throw Error(`Chapter ${chapter.id} manga not found`);
        }

        function formatTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            const weeks = Math.floor(days / 7);
            if (weeks < 4) return `${weeks}w ago`;
            const months = Math.floor(days / 30);
            if (months < 12) return `${months}mo ago`;
            const years = Math.floor(days / 365);
            return `${years}y ago`;
        }

        function downloadUpdates(muuid) {
            fetch("/manga/download/push-job", {
            	method: "POST",
            	headers: {
            	    "Content-Type": "application/json",
            	},
            	body: JSON.stringify({
            	    id: muuid
            	})
        	})
        }

        async function createUpdateElements(chapterList) {
            const chaptersByManga = {};

            chapterList.data.forEach(chapter => {
                const muuid = getMuuidFromChapter(chapter);
                if (!chaptersByManga[muuid]) {
                    chaptersByManga[muuid] = [];
                }
                chaptersByManga[muuid].push(chapter);
            });

            const container = document.getElementById('updates-container');

            for (const muuid in chaptersByManga) {
                const chapters = chaptersByManga[muuid];

                try {
                    const response = await fetch("/manga/" + muuid + "/attributes");
                    const attributes = await response.json();

                    const mangaDiv = document.createElement('div');
                    mangaDiv.className = 'manga-update';

                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'manga-header';
                    headerDiv.onclick = () => window.location.href = `/manga/${muuid}`;

                    const cover = document.createElement('img');
                    cover.className = 'manga-cover';
                    cover.src = `/manga/cover/${muuid}?small=1`;
                    cover.alt = attributes.title.en || 'Manga Cover';

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'manga-info';

                    const title = document.createElement('a');
                    title.className = 'manga-title';
                    title.href = `/manga/${muuid}`;
                    title.textContent = attributes.title || 'Unknown Title';
                    title.onclick = (e) => e.stopPropagation();

                    const stats = document.createElement('div');
                    stats.className = 'manga-stats';
                    stats.innerHTML = `
                        <span>${chapters.length} new chapter${chapters.length > 1 ? 's' : ''}</span>
                        <span>•</span>
                        <span>${formatTimeAgo(chapters[0].attributes.createdAt)}</span>
                    `;

                    infoDiv.appendChild(title);
                    infoDiv.appendChild(stats);

                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.textContent = 'Download Updates';
                    downloadBtn.onclick = (e) => {
                        e.stopPropagation();
                        downloadUpdates(muuid);
                    };

                    headerDiv.appendChild(cover);
                    headerDiv.appendChild(infoDiv);
                    headerDiv.appendChild(downloadBtn);

                    const chaptersList = document.createElement('div');
                    chaptersList.className = 'chapters-list';
                    chaptersList.id = `chapters-${muuid}`;

                    const displayLimit = 3;
                    chapters.forEach((chapter, index) => {
                        const chapterLink = document.createElement('a');
                        chapterLink.className = 'chapter-item';
                        chapterLink.href = `/read/${chapter.id}/1`;

                        const leftDiv = document.createElement('div');
                        leftDiv.className = 'chapter-left';

                        // TODO: Change to view status
                        const flag = document.createElement('div');
                        flag.className = 'chapter-flag';
                        flag.textContent = (chapter.attributes.translatedLanguage || 'en').toUpperCase().slice(0, 2);

                        const chapterInfo = document.createElement('div');
                        chapterInfo.className = 'chapter-info';

                        const titleLine = document.createElement('div');
                        titleLine.className = 'chapter-title-line';
                        const volText = chapter.attributes.volume ? `Vol. ${chapter.attributes.volume} ` : '';
                        const chText = chapter.attributes.chapter ? `Ch. ${chapter.attributes.chapter}` : '';
                        const chTitle = chapter.attributes.title ? ` - ${chapter.attributes.title}` : '';
                        titleLine.textContent = `${volText}${chText}${chTitle}`;

                        const meta = document.createElement('div');
                        meta.className = 'chapter-meta';
                        meta.textContent = `${chapter.attributes.uploader || 'Unknown'} • ${formatTimeAgo(chapter.attributes.createdAt)}`;

                        chapterInfo.appendChild(titleLine);
                        chapterInfo.appendChild(meta);

                        const rightDiv = document.createElement('div');
                        rightDiv.className = 'chapter-right';

                        const pages = document.createElement('div');
                        pages.className = 'chapter-pages';
                        pages.innerHTML = `<span>📄</span><span>${chapter.attributes.pages}</span>`;

                        rightDiv.appendChild(pages);
                        leftDiv.appendChild(flag);
                        leftDiv.appendChild(chapterInfo);
                        chapterLink.appendChild(leftDiv);
                        chapterLink.appendChild(rightDiv);

                        chaptersList.appendChild(chapterLink);
                    });

                    mangaDiv.appendChild(headerDiv);
                    mangaDiv.appendChild(chaptersList);

                    if (chapters.length > displayLimit) {
                        const expandBtn = document.createElement('button');
                        expandBtn.className = 'expand-btn';
                        expandBtn.textContent = `Show all ${chapters.length} chapters ▼`;
                        let isExpanded = false;

                        expandBtn.onclick = () => {
                            isExpanded = !isExpanded;
                            chaptersList.classList.toggle('expanded');
                            expandBtn.textContent = isExpanded
                                ? `Show less ▲`
                                : `Show all ${chapters.length} chapters ▼`;
                        };

                        mangaDiv.appendChild(expandBtn);
                    } else {
                        chaptersList.classList.add('expanded');
                    }

                    container.appendChild(mangaDiv);

                } catch (error) {
                    console.error(`Error loading manga ${muuid}:`, error);
                }
            }
        }

        updatePage();
    </script>
</body>
</html>
